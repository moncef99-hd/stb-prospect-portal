<div class="hp-notif-wrapper">

  <button class="hp-notif-bell-btn" (click)="toggleDropdown()">
    🔔
    <span class="hp-notif-badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
  </button>

  <div class="hp-notif-dropdown" *ngIf="isOpen">

    <div class="hp-notif-header">
      <span>Notifications</span>
      <button class="hp-notif-mark-all" *ngIf="unreadCount > 0" (click)="markAllAsRead()">
        Tout marquer comme lu
      </button>
    </div>

    <div class="hp-notif-list">

      <div *ngIf="loading" class="hp-notif-empty">Chargement...</div>

      <div *ngIf="!loading && notifications.length === 0" class="hp-notif-empty">
        Aucune notification pour le moment.
      </div>

      <div
        class="hp-notif-item"
        *ngFor="let n of notifications"
        [class.unread]="!n.isRead"
        (click)="markAsRead(n, $event)">

        <div class="hp-notif-icon">👤</div>

        <div class="hp-notif-content">
          <div class="hp-notif-message">{{ n.message }}</div>
          <div class="hp-notif-time">{{ timeAgo(n.createdAt) }}</div>
        </div>

        <div class="hp-notif-dot" *ngIf="!n.isRead"></div>

      </div>

    </div>

  </div>

</div>
