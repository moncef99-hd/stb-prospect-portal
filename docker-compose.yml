services:
  postgres:
    image: postgres:16
    container_name: stb-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=stb_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stb-network

  postgres-prospect:
    image: postgres:16
    container_name: stb-postgres-prospect
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=stb_prospect
    ports:
      - "5433:5432"
    volumes:
      - postgres_prospect_data:/var/lib/postgresql/data
    networks:
      - stb-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: stb-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - stb-network

  authservice:
    build: ./backend/AuthService
    container_name: stb-authservice
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=stb_auth;Username=postgres;Password=postgres123
    depends_on:
      - postgres
    networks:
      - stb-network

  prospectservice:
    build: ./backend/ProspectService
    container_name: stb-prospectservice
    ports:
      - "8081:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-prospect;Port=5432;Database=stb_prospect;Username=postgres;Password=postgres123
    depends_on:
      - postgres-prospect
    networks:
      - stb-network

  frontend:
    build: ./frontend/prospect-portal-ui
    container_name: stb-frontend
    ports:
      - "4200:80"
    depends_on:
      - authservice
      - prospectservice
    networks:
      - stb-network

volumes:
  postgres_data:
  postgres_prospect_data:
  rabbitmq_data:

networks:
  stb-network:
    driver: bridge
