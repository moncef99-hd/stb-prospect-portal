services:
  postgres:
    image: postgres:16
    container_name: stb-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=stb_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stb-network

  postgres-prospect:
    image: postgres:16
    container_name: stb-postgres-prospect
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=stb_prospect
    ports:
      - "5433:5432"
    volumes:
      - postgres_prospect_data:/var/lib/postgresql/data
    networks:
      - stb-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: stb-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - stb-network

  authservice:
    build: ./backend/AuthService
    container_name: stb-authservice
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=stb_auth;Username=postgres;Password=postgres123
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - stb-network

  prospectservice:
    build: ./backend/ProspectService
    container_name: stb-prospectservice
    ports:
      - "8081:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-prospect;Port=5432;Database=stb_prospect;Username=postgres;Password=postgres123
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
    depends_on:
      postgres-prospect:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - stb-network

  notificationservice:
    build: ./backend/NotificationService
    container_name: stb-notificationservice
    environment:
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - stb-network

  apigateway:
    build: ./backend/ApiGateway
    container_name: stb-apigateway
    ports:
      - "8000:8080"
    depends_on:
      - authservice
      - prospectservice
    networks:
      - stb-network

  prometheus:
    image: prom/prometheus:latest
    container_name: stb-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - authservice
      - prospectservice
      - apigateway
    networks:
      - stb-network

  grafana:
    image: grafana/grafana:latest
    container_name: stb-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - stb-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: stb-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - stb-network

  frontend:
    build: ./frontend/prospect-portal-ui
    container_name: stb-frontend
    ports:
      - "4200:80"
    depends_on:
      - authservice
      - prospectservice
    networks:
      - stb-network

volumes:
  postgres_data:
  postgres_prospect_data:
  rabbitmq_data:
  grafana_data:
  elasticsearch_data:

networks:
  stb-network:
    driver: bridge